<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>タスク管理 ガントチャート</title>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
            padding: 0;
        }
        .container {
            width: 100%;
            min-height: 100vh;
            background: white;
        }
        header {
            background: linear-gradient(135deg, #0f766e 0%, #0d9488 100%);
            color: white;
            padding: 40px 60px;
            box-shadow: 0 4px 12px rgba(15, 118, 110, 0.2);
            position: relative;
        }
        .nav-links {
            position: absolute;
            top: 40px;
            right: 60px;
            display: flex;
            gap: 16px;
        }
        .nav-link {
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.15);
            transition: background 0.2s;
            font-weight: 500;
            font-size: 14px;
        }
        .nav-link:hover {
            background: rgba(255, 255, 255, 0.25);
        }
        h1 {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }
        header p {
            font-size: 16px;
            opacity: 0.9;
        }
        .info {
            display: flex;
            justify-content: space-around;
            gap: 40px;
            padding: 32px 60px;
            background: white;
            border-bottom: 1px solid #e5e7eb;
        }
        .info-item {
            text-align: center;
        }
        .info-label {
            font-size: 13px;
            font-weight: 600;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        .info-value {
            font-size: 28px;
            font-weight: 700;
            color: #0f766e;
        }
        .chart-wrapper {
            padding: 60px 40px;
            background: white;
            width: 100%;
            overflow-x: auto;
        }
        pre.mermaid {
            background: transparent;
            border: none;
            width: 100%;
            min-width: 100%;
        }
        footer {
            padding: 24px;
            background: #f9fafb;
            text-align: center;
            color: #9ca3af;
            font-size: 14px;
            border-top: 1px solid #e5e7eb;
        }

        /* スクロールバーのスタイリング */
        .chart-wrapper::-webkit-scrollbar {
            height: 10px;
        }
        .chart-wrapper::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 10px;
        }
        .chart-wrapper::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        .chart-wrapper::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="nav-links">
                <a href="/" class="nav-link">📊 ダッシュボード</a>
                <a href="/tasks" class="nav-link">📋 タスク一覧</a>
            </div>
            <h1>🗓️ タスク管理ガントチャート</h1>
            <p>AI Task Manager によって生成されました</p>
        </header>

        <div class="info">
            <div class="info-item">
                <span class="info-label">生成日時</span>
                <span class="info-value">{{ generated_at }}</span>
            </div>
            <div class="info-item">
                <span class="info-label">表示期間</span>
                <span class="info-value">{{ start_date }} 〜 {{ end_date }}</span>
            </div>
            <div class="info-item">
                <span class="info-label">総タスク数</span>
                <span class="info-value">{{ total_tasks }}件</span>
            </div>
        </div>

        <div class="chart-wrapper">
            <pre class="mermaid">
{{ mermaid_chart }}
            </pre>
        </div>

        <footer>
            Generated by AI Task Manager | Powered by Mermaid.js
        </footer>
    </div>

    <script>
        mermaid.initialize({
            startOnLoad: true,
            theme: 'neutral',
            gantt: {
                titleTopMargin: 30,
                barHeight: 40,
                barGap: 10,
                topPadding: 60,
                leftPadding: 200,
                gridLineStartPadding: 40,
                fontSize: 15,
                numberSectionStyles: 4,
                useMaxWidth: true
            }
        });
    </script>
</body>
</html>
