<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>タスク管理 ガントチャート</title>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
            padding: 0;
        }
        .container {
            width: 100%;
            min-height: 100vh;
            background: white;
        }
        header {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: white;
            padding: 40px 60px;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.15);
        }
        h1 {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }
        header p {
            font-size: 16px;
            opacity: 0.9;
        }
        .info {
            display: flex;
            justify-content: space-around;
            gap: 40px;
            padding: 32px 60px;
            background: white;
            border-bottom: 1px solid #e5e7eb;
        }
        .info-item {
            text-align: center;
        }
        .info-label {
            font-size: 13px;
            font-weight: 600;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        .info-value {
            font-size: 28px;
            font-weight: 700;
            color: #111827;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .chart-wrapper {
            padding: 60px 40px;
            background: white;
            width: 100%;
            overflow-x: auto;
        }
        pre.mermaid {
            background: transparent;
            border: none;
            width: 100%;
            min-width: 100%;
        }
        footer {
            padding: 24px;
            background: #f9fafb;
            text-align: center;
            color: #9ca3af;
            font-size: 14px;
            border-top: 1px solid #e5e7eb;
        }

        /* スクロールバーのスタイリング */
        .chart-wrapper::-webkit-scrollbar {
            height: 10px;
        }
        .chart-wrapper::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 10px;
        }
        .chart-wrapper::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        .chart-wrapper::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🗓️ タスク管理ガントチャート</h1>
            <p>AI Task Manager によって生成されました</p>
        </header>

        <div class="info">
            <div class="info-item">
                <span class="info-label">生成日時</span>
                <span class="info-value">{{ generated_at }}</span>
            </div>
            <div class="info-item">
                <span class="info-label">表示期間</span>
                <span class="info-value">{{ start_date }} 〜 {{ end_date }}</span>
            </div>
            <div class="info-item">
                <span class="info-label">総タスク数</span>
                <span class="info-value">{{ total_tasks }}件</span>
            </div>
        </div>

        <div class="chart-wrapper">
            <pre class="mermaid">
{{ mermaid_chart }}
            </pre>
        </div>

        <footer>
            Generated by AI Task Manager | Powered by Mermaid.js
        </footer>
    </div>

    <script>
        mermaid.initialize({
            startOnLoad: true,
            theme: 'base',
            themeVariables: {
                primaryColor: '#6366f1',
                primaryTextColor: '#ffffff',
                primaryBorderColor: '#4f46e5',
                lineColor: '#e5e7eb',
                secondaryColor: '#8b5cf6',
                tertiaryColor: '#f3f4f6',
                background: '#ffffff',
                mainBkg: '#6366f1',
                secondBkg: '#8b5cf6',
                taskTextColor: '#111827',
                taskTextOutsideColor: '#111827',
                taskTextLightColor: '#ffffff',
                activeTaskBkgColor: '#6366f1',
                activeTaskBorderColor: '#4f46e5',
                doneTaskBkgColor: '#10b981',
                doneTaskBorderColor: '#059669',
                critBkgColor: '#ef4444',
                critBorderColor: '#dc2626',
                todayLineColor: '#6366f1',
                gridColor: '#e5e7eb',
                fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif'
            },
            gantt: {
                titleTopMargin: 30,
                barHeight: 40,
                barGap: 10,
                topPadding: 60,
                leftPadding: 200,
                gridLineStartPadding: 40,
                fontSize: 15,
                numberSectionStyles: 4,
                axisFormat: '%m/%d',
                useMaxWidth: true
            }
        });
    </script>
</body>
</html>
