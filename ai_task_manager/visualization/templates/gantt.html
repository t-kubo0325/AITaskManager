<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>タスク管理 ガントチャート</title>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', 'Hiragino Sans', 'Meiryo', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        .info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            padding: 20px 30px;
            background: #f8f9fa;
            border-bottom: 1px solid #dee2e6;
        }
        .info-item {
            display: flex;
            flex-direction: column;
        }
        .info-label {
            font-size: 12px;
            color: #6c757d;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }
        .info-value {
            font-size: 18px;
            font-weight: 600;
            color: #212529;
        }
        .chart-wrapper {
            padding: 30px;
            background: white;
            display: flex;
            justify-content: center;
        }
        pre.mermaid {
            background: transparent;
            border: none;
        }
        footer {
            padding: 20px 30px;
            background: #f8f9fa;
            text-align: center;
            color: #6c757d;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🗓️ タスク管理ガントチャート</h1>
            <p>AI Task Manager によって生成されました</p>
        </header>

        <div class="info">
            <div class="info-item">
                <span class="info-label">生成日時</span>
                <span class="info-value">{{ generated_at }}</span>
            </div>
            <div class="info-item">
                <span class="info-label">表示期間</span>
                <span class="info-value">{{ start_date }} 〜 {{ end_date }}</span>
            </div>
            <div class="info-item">
                <span class="info-label">総タスク数</span>
                <span class="info-value">{{ total_tasks }}件</span>
            </div>
        </div>

        <div class="chart-wrapper">
            <pre class="mermaid">
{{ mermaid_chart }}
            </pre>
        </div>

        <footer>
            Generated by AI Task Manager | Powered by Mermaid.js
        </footer>
    </div>

    <script>
        mermaid.initialize({
            startOnLoad: true,
            theme: 'default',
            themeVariables: {
                primaryColor: '#667eea',
                primaryTextColor: '#fff',
                primaryBorderColor: '#667eea',
                lineColor: '#667eea',
                secondaryColor: '#764ba2',
                tertiaryColor: '#f8f9fa'
            },
            gantt: {
                titleTopMargin: 25,
                barHeight: 35,
                barGap: 8,
                topPadding: 50,
                leftPadding: 120,
                gridLineStartPadding: 35,
                fontSize: 14,
                numberSectionStyles: 4
            }
        });
    </script>
</body>
</html>
